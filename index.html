<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Racing</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px; color: white;
    background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<div id="hud">
  <div>Speed: <span id="speed">0</span> km/h</div>
  <div>Lap: <span id="lap">1</span></div>
  <div>Time: <span id="time">0.00</span>s</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import  as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 400);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0x4a7c4a })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Track (oval)
const trackPoints = [];
const a = 80, b = 50;
for (let i = 0; i <= 100; i++) {
  const t = (i/100)  Math.PI  2;
  trackPoints.push(new THREE.Vector3(Math.cos(t)a, 0, Math.sin(t)b));
}
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);

// Track mesh
const trackShape = new THREE.Shape();
trackShape.moveTo(-6, 0); trackShape.lineTo(6, 0);
trackShape.lineTo(6, 0.05); trackShape.lineTo(-6, 0.05);
const trackGeo = new THREE.ExtrudeGeometry(
  new THREE.Shape([
    new THREE.Vector2(-6,-0.01), new THREE.Vector2(6,-0.01),
    new THREE.Vector2(6,0.01), new THREE.Vector2(-6,0.01)
  ]),
  { steps: 200, extrudePath: trackCurve }
);
const track = new THREE.Mesh(trackGeo, new THREE.MeshStandardMaterial({ color: 0x222222 }));
track.receiveShadow = true;
scene.add(track);

// Barriers
function addBarriers(offset, color) {
  for (let i = 0; i < 100; i++) {
    const t = i/100;
    const p = trackCurve.getPoint(t);
    const tangent = trackCurve.getTangent(t);
    const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const pos = p.clone().add(normal.multiplyScalar(offset));
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color })
    );
    post.position.set(pos.x, 0.5, pos.z);
    post.castShadow = true;
    scene.add(post);
  }
}
addBarriers(7, 0xff0000);
addBarriers(-7, 0xffffff);

// Car factory
function makeCar(color) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.7, 4),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 0.7;
  body.castShadow = true;
  group.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.6, 2),
    new THREE.MeshStandardMaterial({ color: 0x222244 })
  );
  cabin.position.set(0, 1.3, -0.2);
  cabin.castShadow = true;
  group.add(cabin);
  for (const [x, z] of [[-1,1.3],[1,1.3],[-1,-1.3],[1,-1.3]]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16),
      new THREE.MeshStandardMaterial({ color: 0x111111 })
    );
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(x, 0.4, z);
    group.add(wheel);
  }
  return group;
}

const car = makeCar(0xff3333);
car.position.set(a, 0, 0);
scene.add(car);

const aiCar = makeCar(0x3333ff);
aiCar.position.set(a, 0, 5);
scene.add(aiCar);

// Controls
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let speed = 0;
let carAngle = Math.PI/2;
const maxSpeed = 1.2;
const accel = 0.015;
const friction = 0.98;
const turnSpeed = 0.04;

let aiT = 0;
let lap = 1, startTime = performance.now(), lastQuadrant = 0;

function update() {
  // Input
  if (keys['w'] || keys['arrowup']) speed += accel;
  if (keys['s'] || keys['arrowdown']) speed -= accel;
  speed = friction;
  speed = Math.max(-maxSpeed0.5, Math.min(maxSpeed, speed));

  if (Math.abs(speed) > 0.01) {
    if (keys['a'] || keys['arrowleft']) carAngle += turnSpeed  (speed/maxSpeed);
    if (keys['d'] || keys['arrowright']) carAngle -= turnSpeed  (speed/maxSpeed);
  }

  car.position.x += Math.sin(carAngle)  speed;
  car.position.z += Math.cos(carAngle)  speed;
  car.rotation.y = carAngle;

  // AI car follows track
  aiT = (aiT + 0.0015) % 1;
  const aiPos = trackCurve.getPoint(aiT);
  const aiTan = trackCurve.getTangent(aiT);
  aiCar.position.set(aiPos.x, 0, aiPos.z);
  aiCar.rotation.y = Math.atan2(aiTan.x, aiTan.z);

  // Camera follow
  const camOffset = new THREE.Vector3(
    -Math.sin(carAngle)  12,
    6,
    -Math.cos(carAngle)  12
  );
  camera.position.lerp(car.position.clone().add(camOffset), 0.1);
  camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

  // Lap detection (simple quadrant tracking)
  const angle = Math.atan2(car.position.z, car.position.x);
  const q = Math.floor(((angle + Math.PI) / (Math.PI  2))  4);
  if (lastQuadrant === 3 && q === 0) lap++;
  lastQuadrant = q;

  // HUD
  document.getElementById('speed').textContent = Math.round(Math.abs(speed)  100);
  document.getElementById('lap').textContent = lap;
  document.getElementById('time').textContent = ((performance.now() - startTime)/1000).toFixed(2);
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
