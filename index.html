<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Racing</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
  }

  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    background: rgba(0,0,0,0.55);
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 10;
    min-width: 150px;
  }

  #info {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="hud">
  <div>Speed: <span id="speed">0</span> km/h</div>
  <div>Lap: <span id="lap">1</span></div>
  <div>Time: <span id="time">0.00</span>s</div>
  <div id="boost" style="color:#0ff;font-weight:bold"></div>
</div>

<div id="info">WASD / Arrow Keys</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 800);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  2000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// =====================================================
// LIGHTING
// =====================================================

scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(80, 150, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -400;
sun.shadow.camera.right = 400;
sun.shadow.camera.top = 400;
sun.shadow.camera.bottom = -400;
sun.shadow.camera.far = 600;
scene.add(sun);

// =====================================================
// GROUND
// =====================================================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000, 50, 50),
  new THREE.MeshStandardMaterial({ color: 0x4a7c4a })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// =====================================================
// TRACK
// =====================================================

const trackPoints = [
  new THREE.Vector3(0, 0, 180),
  new THREE.Vector3(80, 0, 170),
  new THREE.Vector3(150, 0, 130),
  new THREE.Vector3(190, 0, 60),
  new THREE.Vector3(200, 0, -20),
  new THREE.Vector3(170, 0, -90),
  new THREE.Vector3(220, 0, -140),
  new THREE.Vector3(230, 0, -200),
  new THREE.Vector3(180, 0, -240),
  new THREE.Vector3(90, 0, -230),
  new THREE.Vector3(20, 0, -190),
  new THREE.Vector3(-60, 0, -210),
  new THREE.Vector3(-150, 0, -200),
  new THREE.Vector3(-220, 0, -140),
  new THREE.Vector3(-240, 0, -50),
  new THREE.Vector3(-200, 0, 30),
  new THREE.Vector3(-220, 0, 100),
  new THREE.Vector3(-180, 0, 170),
  new THREE.Vector3(-100, 0, 200),
  new THREE.Vector3(-40, 0, 190),
];

const trackCurve = new THREE.CatmullRomCurve3(
  trackPoints,
  true,
  'catmullrom',
  0.5
);

const trackWidth = 8;

function buildTrackRibbon(curve, width, segments) {
  const positions = [];
  const indices = [];
  const uvs = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t);

    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

    const left = p.clone().add(normal.clone().multiplyScalar(width));
    const right = p.clone().add(normal.clone().multiplyScalar(-width));

    positions.push(left.x, 0.02, left.z);
    positions.push(right.x, 0.02, right.z);

    uvs.push(0, t * 20);
    uvs.push(1, t * 20);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;

    indices.push(a, b, d, a, d, c);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geo.setAttribute(
    'uv',
    new THREE.Float32BufferAttribute(uvs, 2)
  );

  geo.setIndex(indices);
  geo.computeVertexNormals();

  return geo;
}

const track = new THREE.Mesh(
  buildTrackRibbon(trackCurve, trackWidth, 800),
  new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
);

track.receiveShadow = true;
scene.add(track);

// =====================================================
// CENTER LINE
// =====================================================

function buildLineRibbon(curve, width, segments, dashed) {
  const positions = [];
  const indices = [];
  let idx = 0;

  for (let i = 0; i < segments; i++) {
    if (dashed && i % 4 >= 2) continue;

    const t1 = i / segments;
    const t2 = (i + 1) / segments;

    const p1 = curve.getPoint(t1);
    const p2 = curve.getPoint(t2);

    const tan1 = curve.getTangent(t1);
    const tan2 = curve.getTangent(t2);

    const n1 = new THREE.Vector3(-tan1.z, 0, tan1.x)
      .normalize()
      .multiplyScalar(width);

    const n2 = new THREE.Vector3(-tan2.z, 0, tan2.x)
      .normalize()
      .multiplyScalar(width);

    positions.push(p1.x + n1.x, 0.03, p1.z + n1.z);
    positions.push(p1.x - n1.x, 0.03, p1.z - n1.z);
    positions.push(p2.x + n2.x, 0.03, p2.z + n2.z);
    positions.push(p2.x - n2.x, 0.03, p2.z - n2.z);

    indices.push(idx, idx + 1, idx + 3, idx, idx + 3, idx + 2);

    idx += 4;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geo.setIndex(indices);
  geo.computeVertexNormals();

  return geo;
}

scene.add(
  new THREE.Mesh(
    buildLineRibbon(trackCurve, 0.15, 800, true),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  )
);

// =====================================================
// START LINE
// =====================================================

function addStartLine() {
  const p = trackCurve.getPoint(0);
  const tan = trackCurve.getTangent(0);

  const geo = new THREE.PlaneGeometry(trackWidth * 2, 2);

  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 16;

  const ctx = canvas.getContext('2d');

  for (let x = 0; x < 16; x++) {
    for (let y = 0; y < 2; y++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(x * 8, y * 8, 8, 8);
    }
  }

  const tex = new THREE.CanvasTexture(canvas);

  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshBasicMaterial({ map: tex })
  );

  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(p.x, 0.04, p.z);
  mesh.rotation.z = -Math.atan2(tan.x, tan.z);

  scene.add(mesh);
}

addStartLine();

// =====================================================
// BARRIERS
// =====================================================

const barriers = [];

function addBarriers(offset, color) {
  const count = 240;

  for (let i = 0; i < count; i++) {
    const t = i / count;
    const p = trackCurve.getPoint(t);
    const tan = trackCurve.getTangent(t);

    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

    const pos = p.clone().add(normal.multiplyScalar(offset));

    const post = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color })
    );

    post.position.set(pos.x, 0.6, pos.z);
    post.castShadow = true;

    scene.add(post);

    barriers.push({
      pos: new THREE.Vector3(pos.x, 0, pos.z),
      radius: 0.9
    });
  }
}

addBarriers(trackWidth + 1.2, 0xff2222);
addBarriers(-(trackWidth + 1.2), 0xffffff);

// =====================================================
// BOOST PADS
// =====================================================

const boostPads = [];

function addBoostPad(t, side) {
  const p = trackCurve.getPoint(t);
  const tan = trackCurve.getTangent(t);

  const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

  const pos = p.clone().add(
    normal.multiplyScalar(side * (trackWidth * 0.4))
  );

  const pad = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 4),
    new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.9
    })
  );

  pad.rotation.x = -Math.PI / 2;
  pad.rotation.z = -Math.atan2(tan.x, tan.z);
  pad.position.set(pos.x, 0.05, pos.z);

  scene.add(pad);

  const glow = new THREE.Mesh(
    new THREE.RingGeometry(2.2, 2.8, 24),
    new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide
    })
  );

  glow.rotation.x = -Math.PI / 2;
  glow.position.set(pos.x, 0.06, pos.z);

  scene.add(glow);

  boostPads.push({
    pos: new THREE.Vector3(pos.x, 0, pos.z),
    radius: 2.5,
    glow
  });
}

[0.05, 0.18, 0.32, 0.47, 0.60, 0.73, 0.88].forEach((t, i) => {
  addBoostPad(t, i % 2 === 0 ? 1 : -1);
});

// =====================================================
// DECORATIONS
// =====================================================

function distanceToTrack(x, z) {
  let minDist = Infinity;

  for (let i = 0; i < 200; i++) {
    const p = trackCurve.getPoint(i / 200);

    const dx = p.x - x;
    const dz = p.z - z;

    const d = Math.sqrt(dx * dx + dz * dz);

    if (d < minDist) minDist = d;
  }

  return minDist;
}

for (let i = 0; i < 150; i++) {
  for (let tries = 0; tries < 10; tries++) {
    const x = (Math.random() - 0.5) * 700;
    const z = (Math.random() - 0.5) * 700;

    if (distanceToTrack(x, z) > trackWidth + 8) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.5, 3),
        new THREE.MeshStandardMaterial({ color: 0x6b4423 })
      );

      trunk.position.set(x, 1.5, z);
      trunk.castShadow = true;
      scene.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(2.5, 5, 8),
        new THREE.MeshStandardMaterial({ color: 0x2d5a2d })
      );

      leaves.position.set(x, 5, z);
      leaves.castShadow = true;
      scene.add(leaves);

      break;
    }
  }
}

for (let i = 0; i < 60; i++) {
  for (let tries = 0; tries < 10; tries++) {
    const x = (Math.random() - 0.5) * 700;
    const z = (Math.random() - 0.5) * 700;

    if (distanceToTrack(x, z) > trackWidth + 6) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1 + Math.random() * 1.5),
        new THREE.MeshStandardMaterial({ color: 0x808080 })
      );

      rock.position.set(x, 0.5, z);
      rock.castShadow = true;
      scene.add(rock);

      break;
    }
  }
}

// =====================================================
// CARS
// =====================================================

function makeCar(color) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.7, 4),
    new THREE.MeshStandardMaterial({ color })
  );

  body.position.y = 0.7;
  body.castShadow = true;
  group.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.6, 2),
    new THREE.MeshStandardMaterial({ color: 0x222244 })
  );

  cabin.position.set(0, 1.3, -0.2);
  cabin.castShadow = true;
  group.add(cabin);

  return group;
}

const player = makeCar(0xff3333);
player.position.copy(trackCurve.getPoint(0));
scene.add(player);

const aiCars = [
  { color: 0x3333ff, t: 0.98, speed: 0.0025 },
  { color: 0xffff00, t: 0.94, speed: 0.0022 },
  { color: 0x00ff00, t: 0.90, speed: 0.0020 }
];

for (const ai of aiCars) {
  ai.mesh = makeCar(ai.color);
  ai.mesh.position.copy(trackCurve.getPoint(ai.t));
  ai.offset = 0;
  scene.add(ai.mesh);
}

// =====================================================
// CONTROLS
// =====================================================

const keys = {};

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});

addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// =====================================================
// PLAYER STATE
// =====================================================

let speed = 0;

const startTan = trackCurve.getTangent(0);
let angle = Math.atan2(startTan.x, startTan.z);

const maxSpeed = 3.5;
const accel = 0.02;
const friction = 0.985;
const turnSpeed = 0.08;

let boostTimer = 0;
const boostMultiplier = 1.8;

let lap = 1;
let lastT = 0;
const startTime = performance.now();

// =====================================================
// HELPERS
// =====================================================

function getClosestT(pos) {
  let closestT = 0;
  let minD = Infinity;

  for (let i = 0; i < 200; i++) {
    const tt = i / 200;
    const pt = trackCurve.getPoint(tt);

    const dx = pt.x - pos.x;
    const dz = pt.z - pos.z;

    const d = dx * dx + dz * dz;

    if (d < minD) {
      minD = d;
      closestT = tt;
    }
  }

  return closestT;
}

// =====================================================
// UPDATE
// =====================================================

function update() {

  if (keys['w'] || keys['arrowup']) speed += accel;
  if (keys['s'] || keys['arrowdown']) speed -= accel;

  speed *= friction;

  let currentMax = maxSpeed;

  if (boostTimer > 0) {
    currentMax *= boostMultiplier;
    boostTimer--;
  }

  speed = Math.max(
    -currentMax * 0.5,
    Math.min(currentMax, speed)
  );

  if (Math.abs(speed) > 0.01) {
    if (keys['a'] || keys['arrowleft']) {
      angle += turnSpeed * (speed / maxSpeed);
    }

    if (keys['d'] || keys['arrowright']) {
      angle -= turnSpeed * (speed / maxSpeed);
    }
  }

  const newX = player.position.x + Math.sin(angle) * speed;
  const newZ = player.position.z + Math.cos(angle) * speed;

  const dist = distanceToTrack(newX, newZ);

  if (dist < trackWidth - 0.8) {
    player.position.x = newX;
    player.position.z = newZ;
  } else {
    speed *= 0.82;
  }

    for (const bar of barriers) {

    const dx = player.position.x - bar.pos.x;
    const dz = player.position.z - bar.pos.z;

    const d = Math.sqrt(dx * dx + dz * dz);

    // smaller collision distance
    const minD = 0.95;

    if (d < minD) {

        const push = minD - d;

        player.position.x += (dx / d) * push;
        player.position.z += (dz / d) * push;

        // softer slowdown
        speed *= 0.7;
    }
    }

  player.rotation.y = angle;

  // BOOST PADS
  for (const bp of boostPads) {
    const dx = player.position.x - bp.pos.x;
    const dz = player.position.z - bp.pos.z;

    if (dx * dx + dz * dz < bp.radius * bp.radius) {
      boostTimer = 60;
    }

    bp.glow.scale.setScalar(
      1 + Math.sin(performance.now() * 0.005) * 0.15
    );
  }

  // AI
  for (const ai of aiCars) {
    ai.t = (ai.t + ai.speed) % 1;

    if (Math.random() < 0.01) {
      ai.offset = (Math.random() - 0.5) * 4;
    }

    const p = trackCurve.getPoint(ai.t);
    const tan = trackCurve.getTangent(ai.t);

    const normal = new THREE.Vector3(-tan.z, 0, tan.x)
      .normalize()
      .multiplyScalar(ai.offset);

    ai.mesh.position.copy(p.clone().add(normal));
    ai.mesh.rotation.y = Math.atan2(tan.x, tan.z);
  }

  // CAMERA
  const camDist = 16 + Math.abs(speed) * 2.5;

  const camOffset = new THREE.Vector3(
    -Math.sin(angle) * camDist,
    6 + Math.abs(speed),
    -Math.cos(angle) * camDist
  );

  camera.position.lerp(
    player.position.clone().add(camOffset),
    0.1
  );

  camera.lookAt(
    player.position.x,
    player.position.y + 1,
    player.position.z
  );

  // LAPS
  const playerT = getClosestT(player.position);

  if (lastT > 0.85 && playerT < 0.15) {
    lap++;
  }

  lastT = playerT;

  // HUD
  document.getElementById('speed').textContent =
    Math.round(Math.abs(speed) * 100);

  document.getElementById('lap').textContent = lap;

  document.getElementById('time').textContent =
    ((performance.now() - startTime) / 1000).toFixed(2);

  document.getElementById('boost').textContent =
    boostTimer > 0 ? 'BOOST!' : '';
}

// =====================================================
// LOOP
// =====================================================

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

animate();

// =====================================================
// RESIZE
// =====================================================

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
